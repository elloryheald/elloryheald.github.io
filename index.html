<!DOCTYPE html>
<html>
<head>
    <title>Obama</title>
    <link rel="icon" type="image/png" href="https://images.ctfassets.net/l7h59hfnlxjx/582Lx8AhvXHgRLXagk73lV/ef827f6b381202b112b61e218d8e3154/President_Obama_Headshot__Economic_Inclusion___Photo_by_Pari_Dukovic_courtesy_of_Penguin_Random_House_.jpg?q=75&w=2108&fm=webp">
    <style>
html {
    min-height:100%;
    background: linear-gradient(
            -45deg,
            rgba(255, 0, 0, 1) 0%,
            rgba(255, 154, 0, 1) 5%,
            rgba(208, 222, 33, 1) 10%,
            rgba(79, 220, 74, 1) 15%,
            rgba(63, 218, 216, 1) 20%,
            rgba(47, 201, 226, 1) 25%,
            rgba(28, 127, 238, 1) 30%,
            rgba(95, 21, 242, 1) 35%,
            rgba(186, 12, 248, 1) 40%,
            rgba(251, 7, 217, 1) 45%,
            rgba(255, 0, 0, 1) 50%,
            rgba(255, 154, 0, 1) 55%,
            rgba(208, 222, 33, 1) 60%,
            rgba(79, 220, 74, 1) 65%,
            rgba(63, 218, 216, 1) 70%,
            rgba(47, 201, 226, 1) 75%,
            rgba(28, 127, 238, 1) 80%,
            rgba(95, 21, 242, 1) 85%,
            rgba(186, 12, 248, 1) 90%,
            rgba(251, 7, 217, 1) 95%,
            rgba(255, 0, 0, 1) 100%
        );
    background-size: 400% 400%;
    background-position: bottom right;

    animation: a 2s linear infinite;
}
@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

.spinning img {
    animation: spin 2s linear infinite;
}
.spin-button {
    width: 100px;
    cursor: pointer;
    user-select: none;
}

.spin-button:hover {
    transform: scale(1.05);
}

.spin-button:active {
    transform: scale(0.95);
}
</style>
</head>
<body>
<img src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Official_portrait_of_Barack_Obama.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" style="width:500px;height:500px;">
<img src="https://mastersofscale.com/wp-content/uploads/2022/09/MoS_PresidentBarackObama_colorcutout-800x800.webp"style="width:500px;height:500px;">
<img src="https://politifact.com/wp-content/uploads/2026/07/barack_obama_2021.jpg"style="width:500px;height:500px;">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Official_portrait_of_Barack_Obama-2.jpg/960px-Official_portrait_of_Barack_Obama-2.jpg"style="width:500px;height:500px;">
<img src="https://cdn.britannica.com/19/101219-050-A07A26EF/Barack-Obama.jpg"style="width:500px;height:500px;">
<img src="https://i.guim.co.uk/img/media/affec64d8841c54c434781ee58243286b79600d2/0_0_8212_5178/master/8212.jpg?width=465&dpr=1&s=none&crop=none"style="width:500px;height:500px;">
<img src="https://www.cidob.org/sites/default/files/styles/max_width_290/public/2025-07/Obama.jpg.webp?itok=-yhB-hZ1"style="width:500px;height:500px;">
<img src="https://www.senate.gov/artandhistory/history/resources/graphic/xlarge/ObamaBarack.jpg"style="width:500px;height:500px;">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Barack_Obama_in_2016.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"style="width:500px;height:500px;">
<img src="https://m.media-amazon.com/images/I/61QKhYL+eCL.png"
     alt="Spin Button"
     onclick="toggleSpin()"
     class="spin-button">
<script>
function toggleSpin() {
    document.body.classList.toggle("spinning");
}
</script>
</body>
</html>
