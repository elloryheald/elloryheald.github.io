<!DOCTYPE html>
<html>
<head>
    <title>Obama</title>
    <link rel="icon" type="image/png" href="https://images.ctfassets.net/l7h59hfnlxjx/582Lx8AhvXHgRLXagk73lV/ef827f6b381202b112b61e218d8e3154/President_Obama_Headshot__Economic_Inclusion___Photo_by_Pari_Dukovic_courtesy_of_Penguin_Random_House_.jpg?q=75&w=2108&fm=webp">
    <style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #00ffff,
        #0000ff,
        #8b00ff,
        #ff0000
    );

    background-size: 400% 400%;
    animation: rainbowScroll 12s linear infinite;
}

@keyframes rainbowScroll {
    from {
        background-position: 0% 50%;
    }
    to {
        background-position: 400% 50%;
    }
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

.spinning img {
    animation: spin 2s linear infinite;
}

.spin-button {
    width: 100px;
    cursor: pointer;
    user-select: none;
}

.spin-button:hover {
    transform: scale(1.05);
}

.spin-button:active {
    transform: scale(0.95);
}
</style>
</head>
<body>
<img src="https://upload.wikimedia.org/wikipedia/commons/e/e9/Official_portrait_of_Barack_Obama.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" style="width:1000px;height:500px;">
<img src="https://mastersofscale.com/wp-content/uploads/2022/09/MoS_PresidentBarackObama_colorcutout-800x800.webp"style="width:1000px;height:500px;">
<img src="https://politifact.com/wp-content/uploads/2026/07/barack_obama_2021.jpg"style="width:1000px;height:500px;">
<img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Official_portrait_of_Barack_Obama-2.jpg/960px-Official_portrait_of_Barack_Obama-2.jpg"style="width:1000px;height:500px;">
<img src="https://cdn.britannica.com/19/101219-050-A07A26EF/Barack-Obama.jpg"style="width:1000px;height:500px;">
<img src="https://i.guim.co.uk/img/media/affec64d8841c54c434781ee58243286b79600d2/0_0_8212_5178/master/8212.jpg?width=465&dpr=1&s=none&crop=none" style="width:1000px;height:500px;">
<img src="https://www.cidob.org/sites/default/files/styles/max_width_290/public/2025-07/Obama.jpg.webp?itok=-yhB-hZ1"style="width:1000px;height:500px;">
<img src="https://www.senate.gov/artandhistory/history/resources/graphic/xlarge/ObamaBarack.jpg"style="width:1000px;height:500px;">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/73/Barack_Obama_in_2016.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original"style= "width:1000px;height:500px;">
<img src="https://m.media-amazon.com/images/I/61QKhYL+eCL.png"
     alt="Spin Button"
     onclick="toggleSpin()"
     class="spin-button">
<script>
function toggleSpin() {
    document.body.classList.toggle("spinning");
}
</script>
</body>
</html>
