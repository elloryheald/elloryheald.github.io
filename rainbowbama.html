<!DOCTYPE html>

<head>
    <title>Obama</title>
    <link rel="icon" type="image/png" href="https://images.ctfassets.net/l7h59hfnlxjx/582Lx8AhvXHgRLXagk73lV/ef827f6b381202b112b61e218d8e3154/President_Obama_Headshot__Economic_Inclusion___Photo_by_Pari_Dukovic_courtesy_of_Penguin_Random_House_.jpg?q=75&w=2108&fm=webp">
    <style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background: linear-gradient(
        90deg,
        #ff0000,
        #ff7f00,
        #ffff00,
        #00ff00,
        #00ffff,
        #0000ff,
        #8b00ff,
        #ff0000
    );

    background-size: 400% 400%;
    animation: rainbowScroll 12s linear infinite;
}

@keyframes rainbowScroll {
    from {
        background-position: 0% 50%;
    }
    to {
        background-position: 400% 50%;
    }
}

@keyframes spin {
    from {
        transform: rotate(0deg);
    }
    to {
        transform: rotate(360deg);
    }
}

.spinning img {
    animation: spin 2s linear infinite;
}

.spin-button {
    width: 100px;
    cursor: pointer;
    user-select: none;
}

.spin-button:hover {
    transform: scale(1.05);
}

.spin-button:active {
    transform: scale(0.95);
}
</style>
</head>
<body>
